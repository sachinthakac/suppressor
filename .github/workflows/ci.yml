name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web-ext
        run: npm ci

      - name: Syntax-check extension scripts
        run: |
          for f in extension/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Lint extension
        run: npm run lint
