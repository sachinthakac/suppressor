<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="icon" href="icons/icon.svg">
  <style>
    :root {
      --bg: #ffffff; --fg: #18181b; --dim: #71717a; --line: #e4e4e7; --card: #f4f4f5;
      --ok: #16a34a; --bad: #dc2626; --warn: #d97706; --accent: #7c5cff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --fg: #f4f4f5; --dim: #a1a1aa; --line: #2e2e33; --card: #222226; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; }
    }
    * { box-sizing: border-box; }
    body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    h1 { font-size: 15px; margin: 0; flex: 1; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-bottom: 12px; }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .status.ok i { background: var(--ok); } .status.bad i { background: var(--bad); }
    .status.slow i { background: var(--warn); }
    .setup { display: block; margin: -4px 0 12px; padding: 8px 10px; border-radius: 10px; background: var(--card); color: var(--accent); font-weight: 600; text-decoration: none; }
    .setup[hidden] { display: none; }
    .setup:hover { text-decoration: underline; }
    .setup:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--card); margin-bottom: 6px; }
    .row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .row .name { flex: 1; min-width: 0; }
    .row .name b { display: block; font-weight: 600; }
    .row .name span { display: block; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .switch { position: relative; width: 34px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(14px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .opt { display: flex; align-items: center; gap: 10px; margin: 10px 2px; }
    .opt label:not(.switch) { flex: 1; } .opt small { display: block; color: var(--dim); }
    button { all: unset; box-sizing: border-box; width: 100%; text-align: center; padding: 9px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; margin-top: 6px; }
    button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .empty { color: var(--dim); padding: 6px 2px 10px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="" width="22" height="22"><h1>Suppressor</h1>
    <label class="switch" title="Enable Suppressor"><input type="checkbox" id="enabled"><span></span></label>
  </header>
  <div id="status" class="status"><i></i><span>Checking classifier…</span></div>
  <a id="setup" class="setup" href="welcome.html" hidden>Set up the classifier →</a>
  <div id="topics"></div>
  <div class="opt">
    <label for="paranoid">Paranoid mode<small>Blur everything until it has been checked</small></label>
    <label class="switch"><input type="checkbox" id="paranoid"><span></span></label>
  </div>
  <button id="manage">Manage topics</button>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
